# Self-hosted deployment for Sip n Play.
#
# Deliberately a SEPARATE file from upstream's docker-compose.yml — that one provisions
# only a Postgres box for local development, and leaving it untouched keeps
# `git merge upstream/main` free of conflicts on the file most likely to change.
#
#   docker compose -f docker-compose.snp.yml --env-file .env.snp up -d --build
#
# MySQL, not Postgres. Upstream's committed migrations are MySQL-flavoured
# (AUTO_INCREMENT, utf8mb4, ENGINE = InnoDB) while their .env and their
# docker-compose.yml both point at Postgres, so their own recipe cannot run their own
# migrations — doctrine:migrations:migrate dies on `syntax error at or near
# "AUTO_INCREMENT"`. Following the migrations is the lower-risk half of that
# contradiction: future upstream migrations keep applying.
#
# The published port binds to the host, which on a LAN box behind NAT means it is
# reachable at http://<box-lan-ip>:<PORT> and nowhere else. Do not put this behind a
# public reverse proxy: the grimoire has no authentication of its own.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: snp-pocket-grimoire:latest
    container_name: snp-pocket-grimoire
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Override the committed dev default — .env ships a placeholder APP_SECRET.
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.snp}
      DATABASE_URL: "mysql://${DB_USER:-grimoire}:${DB_PASSWORD:?set DB_PASSWORD in .env.snp}@database:3306/${DB_NAME:-grimoire}?serverVersion=8.0&charset=utf8mb4"
      # Flip to 1 once the reference data is imported, to speed up restarts.
      PG_SKIP_IMPORT: ${PG_SKIP_IMPORT:-0}
      # Sip n Play bridge. Only SnpController reads these — the key must never be
      # rendered into the page, which gets passed around a table on a shared phone.
      # Leave blank to disable the integration entirely; the grimoire works without it.
      SNP_BRIDGE_URL: ${SNP_BRIDGE_URL:-}
      SNP_BRIDGE_KEY: ${SNP_BRIDGE_KEY:-}
      SNP_TIMEZONE: ${SNP_TIMEZONE:-Asia/Ho_Chi_Minh}
      # Gate entry behind a signed link from sipnplay.cafe. BLANK = no gate, which is
      # correct for a LAN-only box and is what keeps the current deployment working.
      # Set it (matching GRIMOIRE_TOKEN_SECRET in snp-site) before exposing this beyond
      # the LAN — the app has no login of its own.
      GRIMOIRE_TOKEN_SECRET: ${GRIMOIRE_TOKEN_SECRET:-}
    ports:
      - "${PORT:-8088}:80"

  database:
    image: mysql:8.0
    container_name: snp-pocket-grimoire-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-grimoire}
      MYSQL_USER: ${DB_USER:-grimoire}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.snp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.snp}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - grimoire-db:/var/lib/mysql:rw
    # No published port: only the app container needs to reach the database.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  grimoire-db:
